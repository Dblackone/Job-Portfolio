name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html motion.html web-portfolio.html contact.html thanks.html robots.txt sitemap.xml _site/
          cp -r css js assets portfolio architectural-portfolio consulting cv dova-futures case-studies _site/
          touch _site/.nojekyll

      - name: Verify public artifact boundaries
        run: |
          test -f _site/index.html
          test -f _site/web-portfolio.html
          test -f _site/consulting/bim-model-review.html
          test -f _site/portfolio/bim.html
          test -f _site/cv/cv_construction_source.html
          test -f _site/cv/Vollmann_Akarakiri_CV_Construction.pdf
          test -f _site/dova-futures/index.html
          test -f _site/case-studies/construction-ikotun.html
          test -f _site/case-studies/bim-coordination.html
          test -f _site/case-studies/interior-living-dining.html
          test -f _site/contact.html
          test -f _site/thanks.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test ! -e _site/content-hub

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
